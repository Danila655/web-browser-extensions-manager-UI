<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">S
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Extensions Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header class="header">
        <div class="header-container">
            <img src="assets/images/logo.svg" alt="">
            <button type="button"><img src="assets/images/icon-moon.svg" alt=""></button>
        </div>
    </header>
    <main>
        <section>
            <div class="section-header">
                <h1>Extension list</h1>
                <div class="buttons">
                    <button data-filter="all" class="btn active">All</button>
                    <button data-filter="active" class="btn">Active</button>
                    <button data-filter="inactive" class="btn">Inactive</button>
                </div>
            </div>

            <div class="grid-container">
            </div>
        </section>
    </main>
</body>

</html>
